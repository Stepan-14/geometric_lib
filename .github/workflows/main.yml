name: Run Unit Tests

on:
  push:
    branches:
      - '**' # тест будет прохоить на всех ветках

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # выбираем ОС, на которых будут проводиться тесты

    steps:
      # Скачиваем код репозитория внутрь виртуальной машины
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Python на раннер
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # указываем нужную версию

      # Запуск файла с тестами
      - name: Run test.py
        run: |
          python -m unittest testsAuto.py
